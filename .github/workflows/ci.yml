name: FieldOps v2.2 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: fieldops_postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: 📥 Checkout do Repositório
      uses: actions/checkout@v3

    - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: 📦 Instalar Dependências (Backend)
      run: npm install

    - name: 🗄️ Gerar Cliente Prisma e Migrações
      env:
        DATABASE_URL: postgresql://admin:admin@localhost:5432/fieldops_postgres?schema=public
      run: |
        npx prisma generate
        npx prisma migrate deploy

    - name: 🧪 Rodar Testes (Vitest)
      run: npm run test
      
    - name: 🏗️ Build do Backend (Verificação de Tipos)
      run: npm run build